name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Add chromedriver to PATH
        run: echo "$HOME/bin" >> $GITHUB_PATH

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable \
              libnss3 libxi6 libxcursor1 libxss1 libxrandr2 libasound2t64 \
              libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64
          which google-chrome
          which chromedriver

      - name: Run Robot Framework tests
        run: poetry run bash run_robot_tests.sh
