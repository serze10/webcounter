name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pip install poetry

      - name: Install Firefox (deb) and Geckodriver
        run: |
          sudo apt-get update
          # Poista Snap-versio
          sudo apt-get remove -y firefox
          # Lisää Mozilla PPA ja asenna deb-paketti
          sudo add-apt-repository -y ppa:mozillateam/ppa
          echo 'Package: *\nPin: release o=LP-PPA-mozillateam\nPin-Priority: 1001' | sudo tee /etc/apt/preferences.d/mozilla-firefox
          sudo apt-get update
          sudo apt-get install -y firefox
          # Asenna geckodriver
          GECKODRIVER_VERSION=$(curl -s https://api.github.com/repos/mozilla/geckodriver/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          wget https://github.com/mozilla/geckodriver/releases/download/$GECKODRIVER_VERSION/geckodriver-$GECKODRIVER_VERSION-linux64.tar.gz
          tar -xzf geckodriver-$GECKODRIVER_VERSION-linux64.tar.gz
          sudo mv geckodriver /usr/local/bin/
          # Tarkista asennukset
          which firefox && firefox --version
          which geckodriver && geckodriver --version

      - name: Install dependencies
        run: poetry install

      - name: Run Robot Framework tests
        run: poetry run bash run_robot_tests.sh

      - name: Upload Robot Framework reports
        uses: actions/upload-artifact@v4
        with:
          name: robot-reports
          path: |
            output.xml
            log.html
            report.html